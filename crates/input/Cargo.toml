[package]
name = "halokey-input"
description = "Input injection backends for halokey: uinput on Linux (CGEvent and SendInput to follow)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
halokey-host = { path = "../host" }
halokey-proto = { path = "../proto" }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[lints]
workspace = true
