name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 顶层只读；需要写权限的 publish job 单独声明
permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # 只能在 job 级 env 里读 secrets，步骤的 if: 不能直接引用
      HAS_MACOS_CERT: ${{ secrets.MACOS_SIGNING_CERT != '' }}
      # macOS 签名证书的 SHA-1。已发布的版本把它写进了指定要求（designated requirement），
      # 用户的辅助功能授权绑定在它上面：换证书会让所有用户的授权失效一次，所以这里钉死
      MACOS_SIGNING_CERT_SHA1: 458F11F754939C797825BF630156C96CF6AD187F
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles deb"
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            args: "--bundles deb"
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macos-x86_64
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - name: windows-x86_64
            os: windows-latest
            args: "--bundles msi,nsis"
    steps:
      - uses: actions/checkout@v4
      # 第三方 action 固定到提交（这个工作流要读签名私钥、发布更新清单，不能跟着可变的标签走）
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=2.12.3" --locked
      # beforeBuildCommand 会在 ui/ 跑 npm run build，需要先装前端依赖
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        shell: bash
        working-directory: ui
        run: npm ci
      # 用固定的自签名证书签 macOS 应用：指定要求变成 `certificate root = H"…"`，
      # 每次构建都一样，更新后 macOS 仍认之前给的辅助功能授权（ad-hoc 签名的指定要求是
      # 每次都变的 cdhash）。不是 Developer ID，没有公证，首次打开照旧要「仍要打开」。
      # 没配 secret（例如 fork）时跳过，沿用 tauri.conf.json 的 ad-hoc 签名
      # 但本仓库不能退回 ad-hoc：secret 丢了的话，发出去的 ad-hoc 版本会让用户更新后丢授权
      - name: Require macOS signing certificate
        if: runner.os == 'macOS' && github.repository == 'jiangzhuo/halokey' && env.HAS_MACOS_CERT != 'true'
        run: |
          echo "::error::MACOS_SIGNING_CERT is not set; jiangzhuo/halokey must not ship ad-hoc signed macOS builds"
          exit 1
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/halokey-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # tauri 只传 -s <身份>、不传 --keychain，codesign 按搜索列表找私钥
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          sha1=$(security find-certificate -c "halokey Code Signing" -Z "$keychain" | awk '/^SHA-1 hash:/ {print $3}')
          if [ "$sha1" != "$MACOS_SIGNING_CERT_SHA1" ]; then
            echo "::error::signing certificate SHA-1 '$sha1' does not match MACOS_SIGNING_CERT_SHA1; changing it would revoke every user's Accessibility grant"
            exit 1
          fi
          # 覆盖 tauri.conf.json 里的 signingIdentity "-"
          echo "APPLE_SIGNING_IDENTITY=$sha1" >> "$GITHUB_ENV"
      # 不能加 --no-sign：它会同时跳过更新包签名（.sig）
      - name: Build bundles
        working-directory: apps/halokey
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build ${{ matrix.args }}
      # 身份没传到 tauri 时它照样用 ad-hoc 签名、构建成功；这种包会让用户更新后丢授权，必须拦下
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            macos-arm64) triple=aarch64-apple-darwin ;;
            *) triple=x86_64-apple-darwin ;;
          esac
          app="target/$triple/release/bundle/macos/halokey.app"
          codesign --verify --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')
          echo "designated requirement: $requirement"
          if [ "$HAS_MACOS_CERT" = "true" ]; then
            shopt -s nocasematch
            case "$requirement" in
              *"certificate root = H\"$MACOS_SIGNING_CERT_SHA1\""*) ;;
              *) echo "::error::app is not signed with the halokey certificate"; exit 1 ;;
            esac
          fi
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # 安装包/更新包及其 .sig（不再收集 AppImage）
          find target -path '*/bundle/*' \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          find target -path '*/bundle/*' \( -name '*.deb.sig' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' \) -exec cp {} dist/ \;
          # macOS 更新包固定叫 halokey.app.tar.gz，按架构改名以区分
          case "${{ matrix.name }}" in
            macos-arm64) arch=aarch64; triple=aarch64-apple-darwin ;;
            macos-x86_64) arch=x64; triple=x86_64-apple-darwin ;;
            *) arch=; triple= ;;
          esac
          if [ -n "$arch" ]; then
            version=$(python3 -c "import json; print(json.load(open('apps/halokey/tauri.conf.json'))['version'])")
            src="target/$triple/release/bundle/macos"
            cp "$src/halokey.app.tar.gz" "dist/halokey_${version}_${arch}.app.tar.gz"
            cp "$src/halokey.app.tar.gz.sig" "dist/halokey_${version}_${arch}.app.tar.gz.sig"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: halokey-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 标签触发：版本取自标签，生成 latest.json 并附到草稿 release
      - name: Generate latest.json (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # 标签名经环境变量传入并加引号，不直接拼进脚本（防止 `v$(…)` 这类标签被 shell 执行）
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/make_latest_json.py --artifacts dist --out dist/latest.json --tag "$RELEASE_TAG"
      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: dist/*
      # 手动触发：版本取自 tauri.conf.json，只上传 latest.json 供检查，不发 release
      - name: Generate latest.json (manual)
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/make_latest_json.py --artifacts dist --out dist/latest.json --version-from-conf
      - name: Upload latest.json
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: dist/latest.json
          if-no-files-found: error
