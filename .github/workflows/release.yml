name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - name: macos-x86_64
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
          - name: windows-x86_64
            os: windows-latest
            args: "--bundles msi,nsis"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.12" --locked
      - name: Build bundles
        working-directory: apps/halokey
        run: cargo tauri build --no-sign ${{ matrix.args }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*/bundle/*' \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: halokey-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
