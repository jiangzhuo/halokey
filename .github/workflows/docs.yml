name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bilingual:
    name: Bilingual documentation check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check English/Chinese document pairs
        run: python3 tools/check_docs.py
      - name: Whitespace
        run: git diff --check HEAD~1 HEAD || true
