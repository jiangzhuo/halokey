<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- macOS 菜单栏模板图标：只看透明度，颜色由系统按明暗主题着色。用 `cargo tauri icon apps/halokey/icons/tray-template.svg --png 64 -o <临时目录>` 生成 64x64.png，改名为 tray-template.png。 -->
  <mask id="dot">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="32" cy="21" r="4" fill="#000"/>
  </mask>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#000" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="18" fill="#000" mask="url(#dot)"/>
</svg>
