[package]
name = "halokey-app"
description = "halokey desktop app: tray, settings window and the halo overlay (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "halokey-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
halokey-proto = { path = "../../crates/proto" }
halokey-host = { path = "../../crates/host" }
halokey-runtime = { path = "../../crates/runtime" }

[lints]
workspace = true
