[package]
name = "halokey-app"
description = "halokey desktop app: tray, settings window and the halo overlay (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "halokey-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
halokey-proto = { path = "../../crates/proto" }
halokey-host = { path = "../../crates/host" }
halokey-runtime = { path = "../../crates/runtime" }
halokey-wm = { path = "../../crates/wm" }

[lints]
workspace = true

[features]
# Tauri 用 `custom-protocol` 特性决定"嵌入 ui/dist"还是"加载 devUrl"，与 cargo profile 无关。
# 默认嵌入，这样 `cargo build --release` 就是发布版；开发时 `cargo run --no-default-features`
# （或 `cargo tauri dev`，它会自己加 --no-default-features）才加载 Vite 开发服务器。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
