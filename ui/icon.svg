<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 应用图标源文件。apps/halokey/icons 下的各尺寸用 `cargo tauri icon ui/icon.svg -o <临时目录>` 生成，只拷回桌面端用到的文件（不要 android/、ios/）。 -->
  <!-- 陶土色底板，四周留 100 的边距（macOS 图标网格）。 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#d98f6c"/>
  <!-- 光环 -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#f2c9b5" stroke-width="30"/>
  <!-- 旋钮与指示点 -->
  <circle cx="512" cy="512" r="232" fill="#f5f5f7" stroke="#e3d5cd" stroke-width="10"/>
  <circle cx="512" cy="340" r="30" fill="#a85a32"/>
</svg>
