<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>halo</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 420px; height: 420px; }
  body { font: 13px/1.3 -apple-system, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif; color: #e6e9f0; }
  #ring { position: relative; width: 420px; height: 420px; }
  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 118px; height: 118px; border-radius: 50%;
    background: rgba(17, 20, 28, 0.92); border: 2px solid rgba(125, 211, 252, 0.6);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; box-sizing: border-box;
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .opt {
    position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
    background: rgba(27, 31, 42, 0.92); border: 2px solid rgba(42, 48, 64, 0.9);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; box-sizing: border-box;
    transition: transform 90ms ease, border-color 90ms ease, background 90ms ease;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  }
  .opt.sel { background: #7dd3fc; color: #0b1220; border-color: #7dd3fc; transform: scale(1.14); font-weight: 700; }
  .hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; color: rgba(230,233,240,0.55); font-size: 11px; }
</style>
</head>
<body>
<div id="ring"><div class="center" id="title"></div></div>
<div class="hint">拧旋钮选择 · 按下确认 · 按任意键取消</div>
<script>
// 悬浮层只渲染，不接收焦点；所有输入来自设备线程转发的事件。
const { listen } = window.__TAURI__.event;
const ring = document.getElementById("ring");
let options = [];
function render(halo, selected) {
  ring.querySelectorAll(".opt").forEach(e => e.remove());
  document.getElementById("title").textContent = halo.name;
  options = halo.options;
  const n = options.length, R = 150, cx = 210, cy = 210;
  options.forEach((o, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const el = document.createElement("div");
    el.className = "opt" + (i === selected ? " sel" : "");
    el.style.left = `${cx + R * Math.cos(a)}px`;
    el.style.top = `${cy + R * Math.sin(a)}px`;
    el.textContent = o.label;
    el.dataset.i = i;
    ring.appendChild(el);
  });
}
function select(i) {
  ring.querySelectorAll(".opt").forEach(e => e.classList.toggle("sel", Number(e.dataset.i) === i));
}
listen("halokey", ({ payload }) => {
  if (payload.kind === "haloShow") render(payload.halo, payload.selected);
  else if (payload.kind === "haloSelect") select(payload.selected);
});
</script>
</body>
</html>
